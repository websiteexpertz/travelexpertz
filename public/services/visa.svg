<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150">
  <defs>
    <linearGradient id="visaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4169E1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E90FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="150" fill="#F5F5F5"/>
  <!-- Passport -->
  <rect x="40" y="30" width="120" height="90" fill="url(#visaGradient)" rx="3"/>
  <!-- Passport header -->
  <text x="100" y="55" font-size="16" font-weight="bold" text-anchor="middle" fill="white">PASSPORT</text>
  <!-- Document circle -->
  <circle cx="100" cy="85" r="25" fill="white" opacity="0.9"/>
  <!-- Visa stamp -->
  <g transform="translate(140, 50) rotate(25)">
    <rect x="-15" y="-15" width="30" height="30" fill="none" stroke="#FF4500" stroke-width="2"/>
    <text x="0" y="0" font-size="18" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#FF4500">VISA</text>
  </g>
  <!-- Document lines -->
  <line x1="50" y1="110" x2="150" y2="110" stroke="white" stroke-width="1" opacity="0.7"/>
</svg>