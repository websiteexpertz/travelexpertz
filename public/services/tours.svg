<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150">
  <defs>
    <linearGradient id="tourGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9370DB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BA55D3;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="150" fill="#E6E6FA"/>
  <!-- Mountain -->
  <polygon points="30,120 100,30 170,120" fill="#8B7355"/>
  <!-- Snow cap -->
  <polygon points="100,30 95,50 105,50" fill="#FFFFFF"/>
  <!-- Path -->
  <path d="M 100 120 Q 80 100 60 80" stroke="#D2B48C" stroke-width="3" fill="none"/>
  <!-- Trees -->
  <g id="tree">
    <polygon points="0,0 -8,-15 8,-15" fill="#228B22"/>
    <rect x="-2" y="-5" width="4" height="15" fill="#8B4513"/>
  </g>
  <use href="#tree" x="50" y="90" transform="scale(0.8)"/>
  <use href="#tree" x="120" y="95" transform="scale(0.9)"/>
  <use href="#tree" x="140" y="100" transform="scale(0.7)"/>
  <!-- Sun -->
  <circle cx="160" cy="30" r="20" fill="#FFD700"/>
</svg>