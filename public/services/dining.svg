<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150">
  <defs>
    <linearGradient id="diningGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="150" fill="#FFF8DC"/>
  <!-- Plate -->
  <circle cx="100" cy="80" r="45" fill="white" stroke="#DAA520" stroke-width="3"/>
  <!-- Fork -->
  <g>
    <rect x="50" y="50" width="3" height="50" fill="#C0C0C0"/>
    <circle cx="48" cy="52" r="2" fill="#C0C0C0"/>
    <circle cx="52" cy="52" r="2" fill="#C0C0C0"/>
    <circle cx="50" cy="56" r="2" fill="#C0C0C0"/>
  </g>
  <!-- Knife -->
  <g>
    <rect x="147" y="50" width="3" height="50" fill="#C0C0C0"/>
    <polygon points="150,50 155,55 150,60" fill="#C0C0C0"/>
  </g>
  <!-- Food items on plate -->
  <ellipse cx="95" cy="75" rx="12" ry="8" fill="#FF6347"/>
  <ellipse cx="105" cy="78" rx="10" ry="7" fill="#FFD700"/>
  <ellipse cx="100" cy="88" rx="8" ry="6" fill="#90EE90"/>
  <!-- Napkin -->
  <rect x="70" y="110" width="60" height="3" fill="#FF69B4" opacity="0.6"/>
</svg>