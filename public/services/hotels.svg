<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150">
  <defs>
    <linearGradient id="hotelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB6C1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFC0CB;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="150" fill="#87CEEB"/>
  <!-- Building -->
  <rect x="40" y="40" width="120" height="90" fill="url(#hotelGradient)" stroke="#8B4513" stroke-width="2"/>
  <!-- Door -->
  <rect x="85" y="105" width="30" height="25" fill="#8B4513" stroke="#654321" stroke-width="1"/>
  <!-- Windows -->
  <g id="window">
    <rect x="50" y="50" width="15" height="15" fill="#87CEEB" stroke="#333" stroke-width="1"/>
    <line x1="57.5" y1="50" x2="57.5" y2="65" stroke="#333" stroke-width="0.5"/>
    <line x1="50" y1="57.5" x2="65" y2="57.5" stroke="#333" stroke-width="0.5"/>
  </g>
  <use href="#window" x="25" y="0"/>
  <use href="#window" x="50" y="0"/>
  <use href="#window" x="75" y="0"/>
  <use href="#window" x="0" y="25"/>
  <use href="#window" x="50" y="25"/>
  <use href="#window" x="100" y="25"/>
  <!-- Flag pole -->
  <rect x="155" y="35" width="2" height="20" fill="#8B4513"/>
  <!-- Flag -->
  <polygon points="157,35 157,43 165,39" fill="#FF6347"/>
</svg>