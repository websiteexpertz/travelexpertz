<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600">
  <defs>
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Sky background -->
  <rect width="1920" height="600" fill="url(#skyGradient)"/>
  <!-- Mountains -->
  <polygon points="0,400 400,200 800,400" fill="#8B7355" opacity="0.7"/>
  <polygon points="600,400 1000,150 1400,400" fill="#A0826D" opacity="0.8"/>
  <polygon points="1200,400 1600,100 2000,400" fill="#8B7355" opacity="0.7"/>
  <!-- Clouds -->
  <ellipse cx="200" cy="100" rx="100" ry="60" fill="rgba(255,255,255,0.6)"/>
  <ellipse cx="500" cy="150" rx="120" ry="70" fill="rgba(255,255,255,0.5)"/>
  <ellipse cx="1400" cy="120" rx="110" ry="65" fill="rgba(255,255,255,0.6)"/>
  <ellipse cx="1800" cy="180" rx="130" ry="75" fill="rgba(255,255,255,0.5)"/>
  <!-- Overlay gradient -->
  <rect width="1920" height="600" fill="url(#heroGradient)" opacity="0.3"/>
  <!-- Decorative elements -->
  <g id="plane" transform="translate(400, 200)">
    <ellipse cx="0" cy="0" rx="40" ry="15" fill="white" opacity="0.8"/>
    <polygon points="50,0 80,-15 80,15" fill="white" opacity="0.8"/>
    <rect x="-60" y="-8" width="100" height="16" fill="none" stroke="white" stroke-width="2" opacity="0.6"/>
  </g>
  <!-- Compass rose for decoration -->
  <g transform="translate(1700, 500)">
    <circle cx="0" cy="0" r="40" fill="none" stroke="white" stroke-width="2" opacity="0.5"/>
    <line x1="0" y1="-40" x2="0" y2="40" stroke="white" stroke-width="1" opacity="0.5"/>
    <line x1="-40" y1="0" x2="40" y2="0" stroke="white" stroke-width="1" opacity="0.5"/>
    <polygon points="0,-45 -5,-35 5,-35" fill="white" opacity="0.7"/>
    <text x="0" y="-55" font-size="20" font-weight="bold" text-anchor="middle" fill="white" opacity="0.7">N</text>
  </g>
  <!-- Bottom accent -->
  <rect x="0" y="550" width="1920" height="50" fill="rgba(0,0,0,0.1)"/>
</svg>