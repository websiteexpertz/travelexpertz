<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="150" fill="url(#skyGradient)"/>
  <!-- Airplane -->
  <g transform="translate(100, 75)">
    <!-- Fuselage -->
    <ellipse cx="0" cy="0" rx="25" ry="8" fill="#0066CC"/>
    <!-- Wings -->
    <rect x="-35" y="-3" width="70" height="6" fill="#0066CC"/>
    <!-- Tail -->
    <polygon points="25,0 40,-8 40,8" fill="#0066CC"/>
    <!-- Windows -->
    <circle cx="-10" cy="-4" r="1.5" fill="#FFF"/>
    <circle cx="0" cy="-4" r="1.5" fill="#FFF"/>
    <circle cx="10" cy="-4" r="1.5" fill="#FFF"/>
  </g>
  <!-- Clouds -->
  <ellipse cx="30" cy="30" rx="20" ry="12" fill="rgba(255,255,255,0.6)"/>
  <ellipse cx="160" cy="110" rx="25" ry="14" fill="rgba(255,255,255,0.5)"/>
</svg>