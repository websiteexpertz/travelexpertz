<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150">
  <defs>
    <linearGradient id="carGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF4500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6347;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="150" fill="#F0F8FF"/>
  <!-- Road -->
  <rect x="0" y="90" width="200" height="60" fill="#696969"/>
  <!-- Road markings -->
  <line x1="0" y1="120" x2="200" y2="120" stroke="#FFD700" stroke-width="2" stroke-dasharray="20,10"/>
  <!-- Car body -->
  <rect x="50" y="70" width="100" height="30" rx="5" fill="url(#carGradient)"/>
  <!-- Car top -->
  <ellipse cx="80" cy="65" rx="20" ry="15" fill="url(#carGradient)"/>
  <ellipse cx="120" cy="65" rx="20" ry="15" fill="url(#carGradient)"/>
  <!-- Windows -->
  <rect x="55" y="58" width="20" height="12" fill="#87CEEB" opacity="0.7"/>
  <rect x="105" y="58" width="20" height="12" fill="#87CEEB" opacity="0.7"/>
  <!-- Wheels -->
  <circle cx="70" cy="105" r="12" fill="#333"/>
  <circle cx="70" cy="105" r="8" fill="#666"/>
  <circle cx="130" cy="105" r="12" fill="#333"/>
  <circle cx="130" cy="105" r="8" fill="#666"/>
  <!-- Headlights -->
  <circle cx="52" cy="78" r="4" fill="#FFD700"/>
  <circle cx="60" cy="78" r="4" fill="#FFD700"/>
</svg>